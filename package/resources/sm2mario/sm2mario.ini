; ============================================================================
;  Mario Mode (libsm64) for Marvel's Spider-Man 2 - settings
;  This file lives in <game folder>\sm2mario\ and survives Overstrike reinstalls.
;  Missing keys fall back to the defaults shipped with the mod.
; ============================================================================

[General]
LogLevel = info          ; info | debug   (log: <game>\sm2mario\sm2mario.log)
ShowHud = true           ; Mario's health meter while he is active
StartupMessage = true    ; "Mario Mode ready - press M" toast after loading

[Controls]
; Keys: letters, digits, F1-F24, SPACE, ENTER, ESC, TAB, LSHIFT, RSHIFT, LCTRL,
; LALT, UP/DOWN/LEFT/RIGHT, PAGEUP, PAGEDOWN, LMB, RMB, MMB, MOUSE4, MOUSE5,
; [ ] ; ' , . / \ ` - =   Combos: CTRL+F8.  Alternatives: "LSHIFT, RMB".
ToggleKey = M            ; the game never sees this key (M won't open the map)
KeyForward = W
KeyBack = S
KeyLeft = A
KeyRight = D
KeyJump = SPACE          ; SM64 "A"
KeyPunch = LMB           ; SM64 "B"
KeyCrouch = LSHIFT, RMB  ; SM64 "Z" (crouch, ground pound, long jump, backflip)
KeyWalk = LCTRL          ; hold to walk / tiptoe
MenuKey = F8             ; Mario's settings and cheats (arrows / d-pad to change, Esc to close)
PoseKey = P              ; Mario waves / strikes a pose (cycles)
; The game's own interact button: still the game's (prompts work), and when
; someone has just asked Spider-Man for a photo, Mario poses for them too.
KeyInteract = E, F
PadInteract = Y          ; triangle on a DualSense

; Controller (Xbox names; PlayStation names also work: cross, square, l2...)
PadJump = A
PadPunch = X, B
PadCrouch = LT, RT, LB
PadToggle =              ; optional button combo for the toggle, e.g. LB+RB+Y
PadMenu =                ; optional combo for Mario's menu, e.g. LB+RB+X
PadPose =                ; optional combo for a pose, e.g. LB+Y
StickDeadzone = 0.2
InvertStickY = false

; While Mario is active the game gets every key and button Mario doesn't use
; ([Input] BlockOnlyMarioControls): menus, prompts, the d-pad, photo mode.
; Mouse movement / right stick always reach the game so you keep camera
; control. With BlockOnlyMarioControls = false only these keys reach it:
PassThroughKeys = ESC, ENTER, UP, DOWN, LEFT, RIGHT, F1, F2, F3, F4, F5, F6, F11, F12, ALT, LALT, RALT, LWIN, RWIN, PRINTSCREEN, TAB

; Debug / calibration
DebugOverlayKey = F10
DumpKey = CTRL+F9        ; writes hero components, registry and nearby actors to the log
RescanCameraKey = CTRL+F8
NextCameraKey = CTRL+PAGEDOWN
PrevCameraKey = CTRL+PAGEUP
FovUpKey = CTRL+]
FovDownKey = CTRL+[
MirrorKey = CTRL+F7      ; flip handedness if Mario looks mirrored / controls are swapped
RespawnKey = CTRL+R
CalibrateKey = CTRL+F11  ; cubes at Spider-Man's feet/head: they should stick to him if the camera lock is right

[Mario]
RomFile = sm64.us.z64    ; any US .z64/.n64/.v64 in the sm2mario folder is found anyway
FallDamage = capped      ; off | capped (never lethal) | sm64 (vanilla thresholds)
OnDeath = respawn        ; respawn | hero (Spider-Man goes down, Mario Mode ends)
RegenSeconds = 8         ; regain a wedge after this long without taking damage (0 = off)
RespawnAfterFallSeconds = 30 ; a fall this long respawns Mario where he last stood (the tallest towers take ~20 s)
PoseForPhotos = true     ; wave or strike a pose when people ask Spider-Man for a picture (F8 menu too)
Brightness = 1.0         ; overlay mode only (in the world the game lights Mario)
Ambient = 0.55

[World]
UpAxis = Y               ; game axis that points up (Y per SM2ScriptTemplate's transform code)
Mirror = auto            ; auto (from the game's own camera) | on | off   (CTRL+F7 flips it live)
Sm64UnitsPerMetre = 100  ; Mario is ~160 units tall; 100 makes him ~1.6 m
WaterHeight = none       ; game-space height of the rivers if you want Mario to swim, e.g. 0.0
TeleportDistance = 12    ; if the game moves Spider-Man further than this (fast travel, cutscene)...
OnHeroTeleport = follow  ; ...follow (respawn Mario there) | off (end Mario Mode)
OriginHorizontalLimit = 3000
OriginFallLimit = 1000

[Collision]
; physics - Mario collides with the game's own collision: Spider-Man 2's
;           physics world (the one Spider-Man moves through) is asked with
;           ray casts around Mario every frame - floors and roofs with what
;           they are made of (asphalt, concrete, grass, wood, metal, water:
;           Mario's footsteps match), walls, railings, cars. People aren't
;           solid; cars and other things that move are asked about often.
; world   - 0.3's way: floors and walls from the depth of what the game draws
;           (used automatically if the game's physics can't be asked)
; flat    - a flat floor at the height where you pressed M
Source = physics
RaysPerFrame = 32        ; rays the game casts for Mario each frame (4..64)
QueryHeadroom = 96       ; physics query results per frame left to the game itself (16..240)
WallRayLength = 5.0      ; metres around Mario that walls are looked for
WallRayDirections = 32
RoofSearchHeight = 8     ; floor rays start this far above Mario's feet (metres; more = more
                         ; of each ray's hits spent on awnings and trees overhead)
; An actor with one of these components isn't solid for Mario (a person -
; and anything else with health, like a breakable prop)...
NotSolidComponents = Health, Pedestrian, Ragdoll
; ...unless it also has one of these (a vehicle)
SolidComponents = Vehicle, LandVehicle, VehicleBase
; FloorQuery = 3, WallQuery = 3, WaterQuery = 17   ; the game's query types (advanced)
WorldRange = 30          ; world source: metres of remembered world around Mario
WorldCellSize = 0.25
CellSize = 0.5
GridRadiusCells = 10
ProbeUp = 4.5
ProbeDown = 120
MaxLayers = 3
StepHeight = 0.6
MinClearance = 1.8
EdgeProbeRadiusCells = 6
CoplanarTolerance = 0.3
TallWallExtra = 4.0
WallProbeDirections = 16
WallProbeDistance = 3.5
RebuildDistance = 1.5
RebuildVertical = 3.0
RebuildSeconds = 0.25

[Camera]
Source = auto            ; auto | signature | actor | scan
ActorName =              ; if a camera actor shows up in the CTRL+F9 dump, put (part of) its name here
FovDegrees = 60          ; vertical FOV used until a projection matrix is found
UseScannedFov = true
FlipRight = false        ; set true if Mario moves left on screen when he goes right
LookAtHeight = 1.0
NearPlane = 0.05
ScanThreads = 3
MaxRegionMB = 4096
FollowMarioHeight = true ; the camera follows Mario up and down (F8 menu: CAMERA FOLLOWS JUMPS; off =
                         ; the game's own camera, which trails him)
Override = true          ; the mod places the game's camera around Mario every frame: the game's own
                         ; framing (learnt while Mario stands still) and aim (your mouse / stick), none
                         ; of the lag its camera has chasing a character (false = 0.4's lead below)
Distance = 1.5           ; how far behind Mario the camera sits, times the game's own distance for
                         ; Spider-Man (0.5..3; F8 menu: CAMERA DISTANCE). Walls still bring it in.
VerticalSmoothing = 0.05 ; seconds: how softly the camera follows Mario's jumps (0 = rigidly)
Collision = true         ; the camera comes in front of walls between it and Mario (the game's physics)
PlaceOtherCameras = true ; the game has several cameras and switches between them (in flight, say):
                         ; the mod places each one it sees the game render from, so the view doesn't
                         ; jump between near and far (false = only the first one found, like 0.6.0)
; CollisionQuery = 11    ; the game's query type for that (11 = kCamera, advanced)
FollowLead = 1.0         ; Override = false (or the camera not found): in the air the camera's target is
                         ; led along Mario's jump by the camera's own lag (learnt as he jumps), so it
                         ; keeps up instead of trailing him (0 = the game's own follow, 1 = all of the
                         ; lag made up, up to 2)
FollowLeadMax = 3.0      ; metres

[Hero]
HideHero = engine        ; engine (the game's own Transform::Hide) | write | none
KeepHeroAlive = true     ; heal Spider-Man back up after passing his damage on to Mario
PositionWrites = function ; function (the game's Transform::SetPosition) | direct (write the floats)
                         ; if the log reports "pin drift", try the other one
HoldDuringFrame = true   ; hook the game's transform setters and camera target so Spider-Man - and the
                         ; camera - stay on Mario through the game's frame (its character controller
                         ; puts him back on the ground when Mario jumps). false = 0.2's behaviour,
                         ; and FollowMarioHeight can't do anything (takes effect after a restart)
HoldRadius = 3.0         ; moves farther than this (metres) are the game's own teleports and go through
KeepHidden = true        ; Spider-Man stays hidden while Mario stands in for him, even when the game
                         ; shows him again (hooks the game's Transform::Unhide)
InteractionRelease = 8   ; seconds the game may move Spider-Man (hidden) after you answer a pedestrian
                         ; (photo, high five) so it can play its side of it (0 = never, up to 15)

[Combat]
Enabled = true
ScanRadius = 25
SlotsPerTick = 768       ; actor-pool slots examined per Mario tick when looking for enemies
; Comma-separated substrings of actor names (see the CTRL+F9 dump / LogHits).
EnemyNameInclude =
EnemyNameExclude = hero, player, civilian, ped_, vehicle, car_
; The game's components that give an actor health (enemies' BotHealth is a
; Health, as are its kinds), and those that make one a person (people only
; flinch: HitPeople)
HealthComponents = Health, BotHealth
PersonComponents = Pedestrian, Civilian
EnemyRadius = 0.5
EnemyHeight = 1.8
ReachBonus = 0.25
ShockwaveRadius = 2.5
AttackStrength = 1.0     ; 0.25..4: how hard Mario hits (damage and knockback; also in the F8 menu)
DamageMultiplier = 1.0   ; damage values below are fractions of the enemy's max health
IncomingDamageScale = 1.0
HitCooldownTicks = 10
PunchDamage = 0.20
KickDamage = 0.25
TripDamage = 0.20
SlideKickDamage = 0.30
DiveDamage = 0.30
StompDamage = 0.35
GroundPoundDamage = 0.50
ShockwaveDamage = 0.25
PunchKnockback = 1.0
KickKnockback = 1.5
DiveKnockback = 2.0
SlideKickKnockback = 1.5
ShockwaveKnockback = 2.0
UseGameDamage = true     ; hits go through the game's own damage system, so enemies react to Mario
                         ; like to Spider-Man (false = 0.3's direct health changes)
HitPeople = true         ; people Mario punches and kicks flinch (they take no damage)
; How an enemy reacts to each attack: None, Twitch, Stagger, Knockback, HeavyKnockback,
; Knockdown, FlyBack, HeavyKnockdown, Airborne, PopUp, SuperFlyBack
PunchReaction = Stagger
KickReaction = Knockback
TripReaction = Stagger
SlideKickReaction = Knockdown
DiveReaction = Knockdown
StompReaction = Knockdown
GroundPoundReaction = HeavyKnockdown
ShockwaveReaction = PopUp
LogHits = false

[Audio]
Enabled = true
Volume = 0.8             ; 0..1 (also in the F8 menu)

[Cheats]
; Also in the F8 menu and, with the ModSettings mod, the pause menu (changes
; made there are saved back into this file).
InfiniteHealth = false
WingCap = false          ; triple jump to fly
MetalCap = false         ; caps combine, as in SM64 (wing + metal, metal + vanish...)
VanishCap = false
MoonJump = false         ; hold jump in the air to keep rising
BljAnywhere = false      ; backwards long jump + crouch + jump again: faster and faster, anywhere

[Input]
PauseWithGame = true           ; Mario stops while the game is paused (pause menu, photo mode, loading)
PauseWhenCursorVisible = true  ; menus show the cursor: Mario freezes and the game gets its keys back
BlockOnlyMarioControls = true  ; the game keeps every control Mario doesn't use (false: only PassThroughKeys)
BlockGameInput = true

[Render]
; world   - Mario is drawn inside the game's own frame: into its G-buffer with
;           its camera, so the game lights him (sun, street lights, GI, AO,
;           reflections, fog, exposure), hides him behind buildings, puts him
;           in its sun shadow maps and runs its TAA / DLSS / motion blur on him.
; overlay - v0.1 style: drawn on top of the finished frame (fallback).
Mode = world
FallbackSeconds = 3      ; if Mario can't be put in the frame this long after M, use the overlay
Shadows = true           ; Mario in the game's shadow maps (only regions rebuilt every frame)
ShadowRegions = auto     ; refreshed - only regions seen being cleared / refilled from the cache
                         ; steady    - also regions the game redraws every frame
                         ; auto      - refreshed, and steady if that finds none after a few seconds
Gloss = 0.15             ; 0..1, Mario's shine (F8 menu: SHINE): 0 = the game's plain default material
                         ; (no specular colour, no gloss); up from there, sharper and brighter reflections
Specular = 0.02          ; reflectance at normal incidence at SHINE 50% (0.04 = plastic, lower = more matte)
MetalMaterial = 0        ; metal cap: the game's material entry whose reflections use its ray-traced /
                         ; screen-space reflections (-1 = none)
AlbedoScale = 0.85       ; N64 colours are display colours; this maps them to surface albedo
ShadowBias = 0.0         ; metres, pushes Mario's shadow caster away from the light if it acnes
MarioStencil = auto      ; the stencil mark Mario's pixels get: auto = Spider-Man's (what the game marks in
                         ; the frames just before you press M and not just after - its anti-aliasing and
                         ; upscalers treat marked pixels differently), keep = none, copy = 0.5's, or a
                         ; number (0-255: the whole stencil value)
; StencilCensusFrames = 150  ; auto: frames compared either side of pressing M (advanced)
AlignToCamera = true     ; draw Mario where the camera of each frame had him (the game writes its camera on
                         ; its own thread, a frame early or late by a race: false = 0.6's, which let him
                         ; jump back and forth against his camera when he flew)
GBufferMarkers = GBuffer Dynamic, GBuffer Animated  ; preferred passes if the game names them
; GBufferFormats = 41, 34, 17, 17   ; DXGI formats of the game's G-buffer (advanced)
CaptureWidth = 480       ; width of the depth image read back for collision
FrameReport = true       ; describe the game's frame in sm2mario.log when Mario first appears
PaperWhiteNits = 200     ; HDR only (overlay mode and HUD)

[Debug]
ShowOverlay = false      ; start with the F10 debug overlay open
Calibrate = false        ; start with the CTRL+F11 calibration marker on
TraceCollision = false   ; log every Mario tick, his collision and the world model around him (big log)
TraceCamera = false      ; log each frame the game renders from somewhere the mod didn't put a camera
                         ; (the first 400: where it was, and the nearest camera the mod placed)
