; ============================================================================
;  Spider-Man 2 engine bindings used by Mario Mode.
;
;  Signatures come from LDD565's SM2ScriptTemplate (GPLv3,
;  https://github.com/hbgda/SM2ScriptTemplate) and from Mario Mode's own
;  analysis of the current Spider-Man2.exe (the Transform functions,
;  CameraTarget, PedestrianInteract, the physics ray cast and frame, the
;  CollRequest functions and DamageSphere).
;  If a game patch breaks one, the log says which. Put fixed or new entries in
;  <game>\sm2mario\bindings.user.ini (same format) - it overrides this file and
;  is not wiped when Overstrike reinstalls mods.
;
;  pattern: hex bytes, ?? = any byte, ** = any byte that is the displacement
;           to resolve.  resolve: direct | call (E8 rel32) | rip (disp32)
;  See docs/BINDINGS.md for what each entry does and how to find missing ones.
; ============================================================================

[HeroSystem]
; static HeroSystem object: mov [rip+X], rax in its constructor
pattern = 48 89 05 ** ** ** ** 89 35 ?? ?? ?? ?? 48 89 35
resolve = rip

[GetActor]
; Actor* GetActor(ActorHandle*). Its body also gives the actor pool:
; add rcx,[rip+X] (array pointer) and cmp r8d,[rip+Y] (slot count).
pattern = 44 8B 01 41 8B D0 C1 EA 14 81 E2 FF 07 00 00 74 ?? 41 81 E0 FF FF 0F 00 4B 8D 0C ?? 48 C1 E1 06 48 03 0D ?? ?? ?? ?? 44 3B 05 ?? ?? ?? ?? 73 ?? 0F B7 41 ?? 3B D0 74 ?? 33 C9 48 8B C1
resolve = direct
pool_base_disp = 35
pool_count_disp = 42
serial_disp = 51        ; movzx eax, word ptr [rcx+N]: where an actor's serial is ([Layout] actor_serial follows it)

[TransformSetPosition]
; void Transform::SetPosition(Transform*, const Vector3*). Writes the position
; and flags the transform dirty for the renderer (direct writes skip that).
; (The template's older pattern "0F 10 51 ?? 4C 8B C1" matches an unrelated
; function in current builds.)
pattern = 48 89 5C 24 08 57 48 83 EC 30 80 79 5F 00 48 8B FA C5 F8 29 74 24 20 48 8B D9 C5 F8 10 71 30 75 ?? 45 33 C0 48 8B D1 E8 ?? ?? ?? ?? 8B 07
resolve = direct

[TransformHide]
; void Transform::Hide(Transform*): sets the "hidden" bit (0x20 in the flags
; dword at +0x5C) and marks the transform dirty, so every render pass skips it.
pattern = 8B 41 5C A8 20 75 ?? 83 C8 20 89 41 5C 8B 41 64 8B 15 ?? ?? ?? ?? 89 51 6C
resolve = direct

[TransformUnhide]
; void Transform::Unhide(Transform*)
pattern = 8B 41 5C A8 20 74 ?? 83 E0 DF 89 41 5C 8B 41 64 8B 15 ?? ?? ?? ?? 89 51 6C
resolve = direct

[TransformSetMatrix]
; void Transform::SetMatrix(Transform*, const Matrix44*, Vector3* scale): writes
; the whole matrix (row 3 is the position). Hooked with the setters below so the
; game can't move Spider-Man off Mario between frames ([Hero] HoldDuringFrame).
pattern = 48 8B C4 48 89 58 08 48 89 70 10 48 89 78 18 41 56 48 83 EC 60 80 79 5F 00 49 8B F8
resolve = direct

[TransformSetMatrixEx]
; Transform setter: matrix + bounds + scale
pattern = 48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 48 83 EC 30 48 8B DA 48 8B E9 48 8B CB 48 8D 54
resolve = direct

[TransformSetMatrixEx2]
pattern = C5 FC 10 02 C5 FC 11 01 C5 FC 10 4A 20 C5 FC 11 49 20 C4 C1 78 10 00 C5
resolve = direct

[TransformMarkDirty]
; void Transform::MarkDirty(Transform*, int frame): called after code that
; writes a transform's matrix itself.
pattern = 44 8B 05 ?? ?? ?? ?? 83 FA FF 8B 41 64 44 0F 45 C2 44 89 41 6C
resolve = direct

[CameraTarget]
; What the game's follow camera tracks (an actor's position, or one of its
; joints). Found by its run-time type name; the numbers are vtable slots. The
; check_ patterns must appear in the first 48 bytes of each function.
class = .?AVCameraTarget@Camera2@@
actor_offset = 0x10
get_position = 10
check_get_position = 48 8B 49 10
get_matrix = 11
check_get_matrix = 48 8B 41 10 48 8B 08
get_track_position = 18
check_get_track_position = 48 8B 59 10

[PedestrianInteract]
; The AI behaviour a pedestrian runs while asking Spider-Man for a picture or
; a high five. Its activation (vtable slot `enter`) tells Mario to pose; the
; pedestrian's actor handle is at actor_handle_offset in the behaviour.
class = .?AVBehaviorPedestrianInteract@@
enter = 1
check_enter = 48 8B F2 48 8B D9 E8 ?? ?? ?? ?? 48 8D 4B 64
actor_handle_offset = 0x48

[PhotoMode]
; The game's photo mode (PhotomodeSystem, one global object), taken from where
; its camera-mode switch passes it to the selfie swap (lea rcx, [rip+X] after
; "cmp ebx, 3 ; jne"). Its OnActivate sets the byte at active_offset to 1 and
; its OnDeactivate clears it. In selfie mode it spawns a copy of Spider-Man
; (the "doppelganger") at the hero's spot, with its own head actor and the
; phone: their actor handles. With Mario out they are hidden.
pattern = 48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 41 8B F0 48 8B F9 E8 ?? ?? ?? ?? 8B D6 48 8B CF 8B D8 E8 ?? ?? ?? ?? 8B F8 83 FB 03 75 0C 48 8D 0D ** ** ** ** E8
resolve = rip
active_offset = 0xCE9
doppelganger_offset = 0x884
doppelganger_head_offset = 0x88C
selfie_phone_offset = 0x888

[PhysicsRaycast]
; Physics' immediate ray cast, found where PortalUtil::IssueRayCastImmediate
; calls it: NQueryResult* (PhysicsSystem*, const CollRequest*, const Vec3* from,
; const Vec3* to, const char* tag). Mario's collision ([Collision] Source =
; physics) is built from these. physics_disp: the PhysicsSystem global
; (mov rcx, [rip+X]) in the match.
pattern = 4C 8D 2D ?? ?? ?? ?? 4C 89 6C 24 20 4C 8B CD 4D 8B C7 48 8D 54 24 60 48 8B 0D ?? ?? ?? ?? E8 ** ** ** **
resolve = call
physics_disp = 26
; byte offset of the CollRequest's u16 hit count
request_max_hits = 4

[PhysicsFrame]
; The physics system's end of frame, on the game's main thread: waits for the
; step, then frees the frame's query results. Mario's rays are cast right
; after it. It skips all that while the world is paused - the flag and the
; timestep x time scale it tests tell Mario Mode that the game is paused.
pattern = 48 89 5C 24 08 57 48 83 EC 30 80 3D ?? ?? ?? ?? 00 48 8B D9 75 ?? C5 FA 10 05 ?? ?? ?? ?? C5 FA 59 15 ?? ?? ?? ?? C5 F0 57 C9 C5 F8 2F D1 76 ?? 48 8B 0D ?? ?? ?? ?? 40 32 FF E8
resolve = direct
paused_flag_disp = 12
timestep_disp = 26
timescale_disp = 34
physics_disp = 51

[CollRequestInit]
; CollRequest::CollRequest(CollRequest*, type): a query preset by purpose
; (3 = the hero's movement, 17 = water; [Collision] FloorQuery etc.)
pattern = 48 89 5C 24 10 48 89 4C 24 08 57 48 83 EC 20 8B DA 48 8B F9 E8 ?? ?? ?? ?? 90 48 8B CF E8 ?? ?? ?? ?? 66 C7 47 04 01 00 44 8B C3 49 C1 E0 05 4C 03 05
resolve = direct

[CollRequestRelease]
; CollRequest::~CollRequest
pattern = 40 53 48 83 EC 20 48 8B D9 83 39 FF 74 ?? FF 0D ?? ?? ?? ?? 8B 11 48 8D 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? C7 03 FF FF FF FF
resolve = direct

[CollRequestIgnoreActor]
; CollRequest::AddIgnoreActor(Actor*): Mario's rays don't see Spider-Man
pattern = 48 85 D2 74 ?? 53 48 83 EC 20 48 8B 02 48 8B D9 48 85 C0 74 ?? 8B 40 64 83 39 FF 89 44 24 38 75
resolve = direct

[QueryResultActor]
; Actor* of hit i in a query result (null for the static world): people
; aren't solid for Mario, moving cars are refreshed quickly
pattern = 48 83 EC 28 48 8B 09 48 83 C1 08 4C 63 C2 49 C1 E0 06 49 03 C8 44 0F B6 41 03 45 85 C0 74 ?? 8B 11 81 E2 FF FF FF 00 E8 ?? ?? ?? ?? 48 85 C0 74 ?? F7 40 5C 00 10 00 00
resolve = direct

[PhysicsQueryPool]
; The per-frame pool of query results: lock xadd [rcx+counter], eax ;
; cmp eax, limit. Mario's rays leave most of it to the game.
pattern = 48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 57 41 56 41 57 48 83 EC 20 8B EA B8 01 00 00 00 F0 0F C1 81 ?? ?? ?? ?? 3D ?? ?? ?? ?? 7D
resolve = direct
counter_disp = 35
limit_disp = 40

[DamageSphere]
; DamageRequest* DamageSystem::DamageSphere(DamageSystem*, const Vec3& center,
; float radius, const CollRequest&): Mario's hits damage enemies the game's
; way (hit reactions, knockback, deaths). The DamageSystem object is taken
; from a call to it (lea rcx, [rip+X]). query: the CollRequest preset
; (9 = kDamage). The DamageRequest's fields: byte offset, field-mask bit.
pattern = 48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 48 83 EC 60 C5 F8 29 74 24 50 49 8B E9 C5 F8 28 F2 48 8B F2 48 8B F9 E8 ?? ?? ?? ?? 48 8B D8 48 85 C0 0F 84 ?? ?? ?? ?? 48 8B D5 C7 00 04 00 00 00
resolve = direct
query = 9
masks = 0x8, 0x18
damager = 0x138, 9
type = 0x13C, 10
amount = 0x144, 12
knockback = 0x150, 15
knockback_amount = 0x154, 16
flags = 0x160, 19

[DamageActor]
; DamageRequest* DamageSystem::DamageActor(DamageSystem*, const ActorHandle*):
; damages one actor (the enemy Mario's attack reached) - no sphere query. Same
; DamageSystem object and request fields as [DamageSphere].
pattern = 48 89 5C 24 08 57 48 83 EC 20 48 8B FA 48 8B D9 E8 ?? ?? ?? ?? 48 85 C0 74 ?? C7 00 01 00 00 00 8B 0F 89 48 04 48 83 C0 68
resolve = direct

[ComponentRegistry]
pattern = 48 8D 0D ** ** ** ** E8 ?? ?? ?? ?? 49 8B 4E ?? 48 8D 54 24 ?? 48 83 C1 58
resolve = rip

[GetComponentInfo]
pattern = E8 ** ** ** ** 49 8B 4E ?? 48 8D 54 24 ?? 48 83 C1 58
resolve = call

[GetComponent1]
pattern = 48 89 5C 24 ?? 57 48 83 EC 20 48 8B DA 48 8B F9 48 85 D2 0F 84 ?? ?? ?? ?? 66 83 79 ?? 00
resolve = direct

[GetComponent2]
pattern = 44 0F B7 49 ?? 4C 8B C2
resolve = direct

[Layout]
hero_handle = 0x14
actor_transform = 0x0
actor_flags = 0x8
; An actor's handle is (serial << 20) | slot index (GetActor): the u16 serial
; at actor_serial (11 bits) and the slot's own index at actor_index (20 bits).
; actor_serial (0x8) is read from GetActor's own code ([GetActor] serial_disp);
; set it here only to override that.
actor_index = 0xC
actor_components_a = 0x58
actor_component_list = 0x68
actor_component_count = 0x70
actor_components_b = 0x80
actor_component_mode = 0x88
actor_name = 0xB0
component_info_name = 0x60
; A ComponentInfo's base types (pointers to their infos, inline) and their
; count; flags bit 6: a lookup of this type also matches types derived from
; it (enemies' BotHealth is a Health) - as the game's GetComponent does.
component_info_parents = 0x80
component_info_parent_count = 0xE6
component_info_flags = 0xE4
transform_matrix = 0x0
transform_position = 0x30
transform_flags = 0x5C
transform_hidden_bit = 0x20
transform_hidden_mask = 0x1E0
hero_forward_row = 2
health_max = 0xA0
health_current = 0xD0
pool_stride = 0xC0
; Optional live-actor test for pool slots: (u32 at actor_flags & mask) == mask.
; Leave it 0: SM2ScriptTemplate's "flags" at +0x8 turned out to be the
; handle's serial (actor_serial), so no mask over them means "live".
actor_live_mask = 0x0

; ---------------------------------------------------------------------------
;  Not yet known for Spider-Man 2. Fill these in when found (docs/BINDINGS.md).
; ---------------------------------------------------------------------------

[Camera]
; Global that leads to the gameplay camera object. Optional: without it the
; mod scans memory for the camera matrix (works, but slower to lock on).
pattern =
resolve = rip
pointer_chain =          ; offsets to dereference in order, e.g. 0x0, 0x18
matrix_offset = 0x0
layout = rows            ; rows | columns
fov_offset = -1          ; byte offset of the FOV float in the camera object
fov_units = radians

[Shaders]
; How Mario finds the game's shadow passes: hashes (the 16-byte checksum in
; the shader container, as 32 hex digits) of the shadow-caster and shadow-cache
; shaders. The current build's are built in. If an update changes them, Mario
; loses his shadow (he is still drawn and lit); the frame report in
; sm2mario.log then lists the depth-only shaders it saw - add them here, in
; bindings.user.ini, comma-separated.
CasterVS =
CasterPS =
CacheCopyPS =
CacheMovePS =

[HideHero]
; Only used when sm2mario.ini [Hero] HideHero = write (the default, "engine",
; uses TransformHide/TransformUnhide above)
base = transform         ; transform | actor
offset = -1
type = u8                ; u8 | u16 | u32 | f32
hidden_value = 1
shown_value = 0
